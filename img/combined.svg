<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" version="1.1" viewBox="0 0 640 340" width="640" height="340" font-family="Public Sans, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14">
  <title>What the six programs would take from the 400 richest Americans</title>
  <circle cx="150" cy="170" r="140" fill="#25547f"/>
  <path d="M 150 170 L 150.00 30.00 A 140 140 0 0 1 286.13 137.32 Z" fill="#1c1a17" stroke="#efe6d2" stroke-width="1"/>
  <path d="M 150 170 L 286.13 137.32 A 140 140 0 0 1 245.19 272.66 Z" fill="#4a4640" stroke="#efe6d2" stroke-width="1"/>
  <path d="M 150 170 L 245.19 272.66 A 140 140 0 0 1 226.13 287.49 Z" fill="#77716a" stroke="#efe6d2" stroke-width="1"/>
  <path d="M 150 170 L 226.13 287.49 A 140 140 0 0 1 207.31 297.73 Z" fill="#a39c92" stroke="#efe6d2" stroke-width="1"/>
  <path d="M 150 170 L 207.31 297.73 A 140 140 0 0 1 195.66 302.34 Z" fill="#c4bcaf" stroke="#efe6d2" stroke-width="1"/>
  <path d="M 150 170 L 195.66 302.34 A 140 140 0 0 1 185.14 305.52 Z" fill="#ddd3c1" stroke="#efe6d2" stroke-width="1"/>
  <rect x="320" y="28" width="16" height="16" fill="#1c1a17" stroke="#1c1a17" stroke-width="0.5"/>
  <text x="344" y="40" fill="#1c1a17">Pay off every federal student loan</text>
  <text x="344" y="56" fill="#4a4640" font-size="12">$1,700 billion (21%)</text>
  <rect x="320" y="72" width="16" height="16" fill="#4a4640" stroke="#1c1a17" stroke-width="0.5"/>
  <text x="344" y="84" fill="#1c1a17">Give $10,000 to every American household</text>
  <text x="344" y="100" fill="#4a4640" font-size="12">$1,348 billion (17%)</text>
  <rect x="320" y="116" width="16" height="16" fill="#77716a" stroke="#1c1a17" stroke-width="0.5"/>
  <text x="344" y="128" fill="#1c1a17">Pay off all medical debt</text>
  <text x="344" y="144" fill="#4a4640" font-size="12">$220 billion (2.75%)</text>
  <rect x="320" y="160" width="16" height="16" fill="#a39c92" stroke="#1c1a17" stroke-width="0.5"/>
  <text x="344" y="172" fill="#1c1a17">Lift every American out of poverty</text>
  <text x="344" y="188" fill="#4a4640" font-size="12">$195 billion (2.4%)</text>
  <rect x="320" y="204" width="16" height="16" fill="#c4bcaf" stroke="#1c1a17" stroke-width="0.5"/>
  <text x="344" y="216" fill="#1c1a17">Clean water and toilets for everyone, for a year</text>
  <text x="344" y="232" fill="#4a4640" font-size="12">$114 billion (1.4%)</text>
  <rect x="320" y="248" width="16" height="16" fill="#ddd3c1" stroke="#1c1a17" stroke-width="0.5"/>
  <text x="344" y="260" fill="#1c1a17">Eradicate malaria</text>
  <text x="344" y="276" fill="#4a4640" font-size="12">$100 billion (1.25%)</text>
  <rect x="320" y="292" width="16" height="16" fill="#25547f"/>
  <text x="344" y="304" fill="#1c1a17" font-weight="bold">Left over: $4.3 trillion</text>
</svg>
