  <rect x="320" y="28" width="16" height="16" fill="#1c1a17" stroke="#1c1a17" stroke-width="0.5"/>
  <text x="344" y="40" fill="#1c1a17">The 2021 child tax credit, forever</text>
  <text x="344" y="56" fill="#4a4640" font-size="12">$2.14 trillion (27%)</text>
  <rect x="320" y="72" width="16" height="16" fill="#35322e" stroke="#1c1a17" stroke-width="0.5"/>
  <text x="344" y="84" fill="#1c1a17">Rebuild America’s drinking water</text>
  <text x="344" y="100" fill="#4a4640" font-size="12">$625 billion (7.8%)</text>
  <rect x="320" y="116" width="16" height="16" fill="#4e4a44" stroke="#1c1a17" stroke-width="0.5"/>
  <text x="344" y="128" fill="#1c1a17">Clean water and toilets by 2030</text>
  <text x="344" y="144" fill="#4a4640" font-size="12">$456 billion (5.7%)</text>
  <rect x="320" y="160" width="16" height="16" fill="#68635a" stroke="#1c1a17" stroke-width="0.5"/>
  <text x="344" y="172" fill="#1c1a17">Internet for everyone by 2030</text>
  <text x="344" y="188" fill="#4a4640" font-size="12">$428 billion (5.4%)</text>
  <rect x="320" y="204" width="16" height="16" fill="#817b71" stroke="#1c1a17" stroke-width="0.5"/>
  <text x="344" y="216" fill="#1c1a17">Electricity and clean cooking</text>
  <text x="344" y="232" fill="#4a4640" font-size="12">$263 billion (3.3%)</text>
  <rect x="320" y="248" width="16" height="16" fill="#9a9388" stroke="#1c1a17" stroke-width="0.5"/>
  <text x="344" y="260" fill="#1c1a17">Free school meals, forever</text>
  <text x="344" y="276" fill="#4a4640" font-size="12">$224 billion (2.8%)</text>
  <rect x="320" y="292" width="16" height="16" fill="#b4ac9e" stroke="#1c1a17" stroke-width="0.5"/>
  <text x="344" y="304" fill="#1c1a17">Fix every US transit system</text>
  <text x="344" y="320" fill="#4a4640" font-size="12">$140.2 billion (1.75%)</text>
  <rect x="320" y="336" width="16" height="16" fill="#cdc4b4" stroke="#1c1a17" stroke-width="0.5"/>
  <text x="344" y="348" fill="#1c1a17">Eradicate malaria</text>
  <text x="344" y="364" fill="#4a4640" font-size="12">$100 billion (1.25%)</text>
  <rect x="320" y="380" width="16" height="16" fill="#e6dccb" stroke="#1c1a17" stroke-width="0.5"/>
  <text x="344" y="392" fill="#1c1a17">Vaccinate 500 million children</text>
  <text x="344" y="408" fill="#4a4640" font-size="12">$11.9 billion (0.15%)</text>
  <rect x="320" y="424" width="16" height="16" fill="#25547f"/>
  <text x="344" y="436" fill="#1c1a17" font-weight="bold">Left over: $3.6 trillion</text>
