<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=1440">
<link href="https://fonts.googleapis.com/css2?family=Kalam:wght@400;700&family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--pad:#e7efdb;--grid:#9dbb8a;--lead:#34352f;--red:#c8102e}
*{margin:0;box-sizing:border-box}
body{width:1440px;height:900px;overflow:hidden;position:relative;font-family:'Atkinson Hyperlegible';color:var(--lead);
background:var(--pad) repeating-linear-gradient(0deg,transparent 0 19px,rgba(157,187,138,.6) 19px 20px),repeating-linear-gradient(90deg,transparent 0 19px,rgba(157,187,138,.6) 19px 20px)}
.bar{position:absolute;top:40px;left:0;width:1440px;height:480px;background:repeating-linear-gradient(-55deg,rgba(52,53,47,.55) 0 2px,transparent 2px 5px);border-top:3px solid var(--lead);border-bottom:3px solid var(--lead)}
.h{position:absolute;top:58px;left:40px;font:700 52px Kalam;background:var(--pad);padding:0 10px}
.prog{position:absolute;top:120px;left:600px;width:900px;height:380px;background:var(--pad);border:3px solid var(--red)}
.prog p{font:700 60px/1 Kalam;color:var(--red);padding:90px 40px 0}
.circ{position:absolute;top:580px;left:380px;width:120px;height:70px;border:3px solid var(--red);border-radius:50%;transform:rotate(-6deg)}
.note{position:absolute;top:590px;left:520px;font:700 30px Kalam;color:var(--red)}
.count{position:absolute;top:560px;left:40px;font:700 56px Kalam}
.pie{position:absolute;top:560px;right:60px;width:160px;height:160px;border-radius:50%;border:3px solid var(--lead);background:conic-gradient(var(--red) 0 4%,transparent 4%)}
.pl{position:absolute;top:740px;right:40px;font:700 30px Kalam;color:var(--red)}
.nav{position:absolute;bottom:30px;left:50%;transform:translateX(-50%);font:700 30px Kalam}
</style></head><body>
<div class="bar"></div><div class="h">400 richest Americans: $8 trillion</div>
<div class="prog"><p>Eradicate malaria<br>$100 billion</p></div>
<div class="count">$312 billion</div><div class="circ"></div><div class="note">← 1 cell = $1,000</div>
<div class="pie"></div><div class="pl">1.25% gone · $7.9T left</div>
<div class="nav">‹ back &nbsp;&nbsp; next ›</div>
</body></html>
