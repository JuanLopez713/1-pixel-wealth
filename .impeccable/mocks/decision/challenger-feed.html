<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=1440">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;800&display=swap" rel="stylesheet">
<style>*{margin:0;box-sizing:border-box}
body{width:1440px;height:900px;overflow:hidden;position:relative;background:#25547f;font-family:Archivo;color:#fff}
.prog{position:absolute;top:120px;left:0;width:1100px;height:540px;background:#e0662a}
.scrim{position:absolute;left:0;right:0;bottom:0;height:300px;background:linear-gradient(transparent,rgba(0,0,0,.7))}
.cap{position:absolute;left:48px;bottom:70px;max-width:760px}
.cap b{display:block;font:800 72px/1 Archivo}
.cap span{font:500 22px Archivo}
.rail{position:absolute;right:40px;top:200px;display:flex;flex-direction:column;gap:42px;align-items:center}
.g{width:70px;height:70px;border-radius:50%;border:4px solid #fff}
.g.p{background:conic-gradient(#fff 0 4%,transparent 4%)}
.rail small{font:800 18px Archivo;display:block;text-align:center;margin-top:8px}
.dots{position:absolute;bottom:24px;left:50%;transform:translateX(-50%);display:flex;gap:10px}
.dots i{width:10px;height:10px;border-radius:50%;background:rgba(255,255,255,.5)}.dots i:nth-child(3){background:#fff}
</style></head><body>
<div class="prog"></div><div class="scrim"></div>
<div class="cap"><b>Eradicate malaria: $100 billion</b><span>1.25% of what the 400 richest Americans own</span></div>
<div class="rail"><div><div class="g"></div><small>$312B</small></div><div><div class="g p"></div><small>1.25%</small></div><div><div class="g"></div><small>scale</small></div></div>
<div class="dots"><i></i><i></i><i></i><i></i><i></i><i></i></div>
</body></html>
